<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Untuk Febri</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Quicksand:wght@500;700&display=swap"
      rel="stylesheet"
    />

    <!-- Custom CSS Styles and Animations -->
    <style>
      body {
        font-family: "Fredoka", "Quicksand", sans-serif;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      /* Scenic Background Image with Dark Overlay */
      .bg-scenic {
        background-image:
          linear-gradient(
            to bottom,
            rgba(10, 25, 47, 0.4),
            rgba(10, 25, 47, 0.6)
          ),
          url("https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1200&q=80");
        background-size: cover;
        background-position: center;
      }

      /* Glassmorphism Card Style */
      .bucin-card {
        background: rgba(13, 27, 42, 0.85);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 2px solid rgba(255, 255, 255, 0.9);
        box-shadow:
          0 20px 40px rgba(0, 0, 0, 0.4),
          0 0 20px rgba(255, 255, 255, 0.1);
      }

      /* Pulsing Glow Animation for Avatar Frame */
      @keyframes avatarPulse {
        0%,
        100% {
          box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        }
        50% {
          box-shadow: 0 0 25px rgba(255, 255, 255, 0.6);
        }
      }

      .avatar-glow {
        animation: avatarPulse 3s infinite ease-in-out;
      }

      /* Button Custom Glow and Active State */
      .pink-btn {
        background: linear-gradient(135deg, #ff6584, #e04070);
        box-shadow: 0 6px 15px rgba(224, 64, 112, 0.4);
        transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }

      .pink-btn:active {
        transform: scale(0.93);
      }

      /* Calculator Button Styles */
      .calc-btn {
        background: #f472b6;
        color: white;
        font-weight: 700;
        border-radius: 1rem;
        box-shadow:
          inset 0 -3px 0 rgba(0, 0, 0, 0.2),
          0 4px 10px rgba(244, 114, 182, 0.3);
        transition: all 0.15s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        user-select: none;
      }

      .calc-btn:active {
        transform: translateY(2px);
        box-shadow: inset 0 -1px 0 rgba(0, 0, 0, 0.2);
      }

      .calc-btn-action {
        background: #e11d48;
      }

      /* Custom Typing Caret Cursor */
      .typing-cursor::after {
        content: "|";
        animation: blink 0.8s infinite;
      }

      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0;
        }
      }

      /* Floating Hearts Background Animation */
      .floating-heart {
        position: absolute;
        pointer-events: none;
        animation: floatUp 4s linear forwards;
        opacity: 0.8;
      }

      @keyframes floatUp {
        0% {
          transform: translateY(0) scale(0.8) rotate(0deg);
          opacity: 1;
        }
        100% {
          transform: translateY(-100vh) scale(1.3) rotate(360deg);
          opacity: 0;
        }
      }
    </style>
  </head>

    <!-- JavaScript Logic -->
    <script>
      const music = document.getElementById("bgMusic");

      // Fungsi khusus untuk memulai musik (dipanggil HANYA saat verifikasi berhasil)
      function playAudio() {
        if (music) {
          music.play().catch((err) => {
            console.log("Audio playback ditahan browser:", err);
          });
        }
      }

      // VERIFICATION LOGIC
      const validNames = [
        "berlin",
        "febri",
        "febri artika sari hia",
        "ayong",
        "ayong hati telaumbanua",
      ];

      function handleVerification(e) {
        e.preventDefault();
        const inputVal = document
          .getElementById("nameInput")
          .value.trim()
          .toLowerCase();
        const errorMsg = document.getElementById("errorMsg");

        if (validNames.includes(inputVal)) {
          errorMsg.classList.add("hidden");

          // Memutar musik hanya jika verifikasi berhasil
          playAudio();

          const verifyModal = document.getElementById("verifyModal");
          verifyModal.classList.add("opacity-0", "pointer-events-none");
          setTimeout(() => {
            verifyModal.style.display = "none";
            startMainIntroSequence();
          }, 500);
        } else {
          errorMsg.classList.remove("hidden");
        }
      }

      // Typing Sequence Data
      const text1 = "24 + 5 + 2026";
      const text2 = "Hasilnya Berapa ya? 🤔";

      const mathContainer = document.getElementById("mathText");
      const questionContainer = document.getElementById("questionText");
      const nextButton = document.getElementById("nextBtn");

      // Typewriter implementation
      function typeWriter(text, element, speed, callback) {
        let i = 0;
        element.classList.add("typing-cursor");

        function type() {
          if (i < text.length) {
            element.innerHTML += text.charAt(i);
            i++;
            setTimeout(type, speed);
          } else {
            element.classList.remove("typing-cursor");
            if (callback) setTimeout(callback, 300);
          }
        }
        type();
      }

      // Start Main Typing Sequence after successful verification
      function startMainIntroSequence() {
        typeWriter(text1, mathContainer, 120, () => {
          typeWriter(text2, questionContainer, 70, () => {
            nextButton.classList.remove("opacity-0", "pointer-events-none");
            nextButton.classList.add("animate-pulse");
          });
        });
      }

      // Switch from Intro Card to Calculator Screen
      function showCalculator() {
        createHeartBurst();
        const introCard = document.getElementById("introCard");
        const calcCard = document.getElementById("calcCard");

        introCard.classList.add("hidden");
        calcCard.classList.remove("hidden");
      }

      /* CALCULATOR LOGIC */
      let expression = "";
      const displayEl = document.getElementById("calcDisplay");

      function calcInput(val) {
        if (
          displayEl.innerText === "i love u ayong 💞" ||
          displayEl.innerText === "Error"
        ) {
          expression = "";
        }
        expression += val;
        displayEl.innerText = expression;
      }

      function calcClear() {
        expression = "";
        displayEl.innerText = "0";
      }

      function calcCalculate() {
        // Clean expression for checking secret conditions
        const cleaned = expression.replace(/\s+/g, "");

        // Easter Egg Target Expressions
        if (
          cleaned === "7+2+1" ||
          cleaned === "24+5+2025" ||
          cleaned === "24+05+2025" ||
          cleaned === "24+5+2026" ||
          cleaned === "24+05+2026"
        ) {
          displayEl.innerText = "i love u ayong 💞";
          expression = "";
          triggerLoveEffects();

          // Move to Loading and Message card after short delay
          setTimeout(() => {
            startSecretSequence();
          }, 1200);
          return;
        }

        // Standard Math Evaluation
        try {
          let evalExpr = expression.replace(/x/g, "*").replace(/%/g, "/100");
          let result = eval(evalExpr);

          if (result === undefined || isNaN(result)) {
            displayEl.innerText = "Error";
            expression = "";
          } else {
            if (Number.isInteger(result)) {
              displayEl.innerText = result;
            } else {
              displayEl.innerText = parseFloat(result.toFixed(6));
            }
            expression = displayEl.innerText;
          }
        } catch (e) {
          displayEl.innerText = "Error";
          expression = "";
        }
      }

      /* SECRET SEQUENCE: LOADING (10%-100%) -> TYPING MESSAGE */
      function startSecretSequence() {
        document.getElementById("calcCard").classList.add("hidden");
        const resultCard = document.getElementById("resultCard");
        resultCard.classList.remove("hidden");

        const loadingText = document.getElementById("loadingText");
        let percent = 10;

        // Animate Loading from 10% to 100%
        const loadingInterval = setInterval(() => {
          percent += 10;
          if (percent <= 100) {
            loadingText.innerHTML = `I Love U ayong hatii ${percent}% 💞`;
          } else {
            clearInterval(loadingInterval);
            // After 100%, start typing the rest of the message
            setTimeout(typeFullMessage, 400);
          }
        }, 180);
      }

      function typeFullMessage() {
        const p1 = document.getElementById("p1");
        const p2 = document.getElementById("p2");
        const p3 = document.getElementById("p3");
        const p4 = document.getElementById("p4");

        const textP1 = "Sekarang, Kamu Tau Ngga? 🤫";
        const textP2 = "Sejauh ini pemeran utamanya adalah kamu 🤔";
        const textP3 = "dan hingga detik ini";
        const textP4 =
          "yang aku mau tetaplah kamu. kamu dengan segala hal tentang dirimu yang selalu membuatku jatuh dan merindu. yang tidak aku temukan di dalam diri siapapun selain kamu🥰";

        typeWriter(textP1, p1, 50, () => {
          typeWriter(textP2, p2, 45, () => {
            typeWriter(textP3, p3, 50, () => {
              typeWriter(textP4, p4, 40, () => {
                triggerLoveEffects();
              });
            });
          });
        });
      }

      // Heart Burst and Confetti Effect for Secret Match
      function triggerLoveEffects() {
        confetti({
          particleCount: 150,
          spread: 80,
          origin: { y: 0.6 },
          colors: ["#ff6584", "#f472b6", "#ffffff", "#fb7185"],
        });
        createHeartBurst();
      }

      // Floating Hearts Helper
      function createHeartBurst() {
        for (let i = 0; i < 10; i++) {
          const heart = document.createElement("div");
          heart.className = "floating-heart text-2xl";
          heart.innerText = ["💖", "💕", "✨", "🌸", "💘"][
            Math.floor(Math.random() * 5)
          ];
          heart.style.left = Math.random() * 80 + 10 + "vw";
          heart.style.bottom = "10px";
          heart.style.animationDuration = Math.random() * 2 + 2 + "s";
          document.body.appendChild(heart);

          setTimeout(() => heart.remove(), 4000);
        }
      }
    </script>
  </body>
</html>
